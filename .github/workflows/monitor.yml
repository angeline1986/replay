name: Monitorar canais
on:
  schedule:
    # Edite os horários abaixo (hora local de São Paulo). Máximo: duas coletas/dia.
    - cron: '17 9,21 * * *'
      timezone: 'America/Sao_Paulo'
permissions:
  contents: read
concurrency:
  group: replay-monitor
  cancel-in-progress: false
jobs:
  collect:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Coletar vídeos públicos
        run: npm run collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
