name: Monitorar canais
on:
  schedule:
    - cron: '0 17 * * *'
      timezone: 'America/Sao_Paulo'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: replay-monitor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - id: daily_gate
        name: Verificar limite diário
        run: node --experimental-strip-types scripts/check-daily-limit.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Coleta bloqueada pelo limite diário
        if: steps.daily_gate.outputs.allowed == 'false'
        run: echo 'Limite diário atingido; nenhuma coleta foi executada.'
      - if: steps.daily_gate.outputs.allowed == 'true'
        run: npm ci
      - id: collect_videos
        name: Coletar vídeos públicos
        if: steps.daily_gate.outputs.allowed == 'true'
        run: npm run collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
